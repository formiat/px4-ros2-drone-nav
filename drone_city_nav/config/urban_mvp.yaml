    maximum_heading_variance_rad2: 0.05
    startup_heading_alignment_tolerance_rad: 0.15
    motion_compensate_lidar_pose: true
    lidar_pose_latency_s: 0.05
    compensate_lidar_attitude: true
    lidar_mount_roll_rad: 0.0
    lidar_mount_pitch_rad: 0.0
    lidar_mount_yaw_rad: 0.0
    lidar_z_offset_m: 0.315
    use_full_lidar_extrinsic: true
    lidar_extrinsic_translation_body_frd_m: [0.12, 0.0, -0.315]
    lidar_extrinsic_quaternion_lidar_flu_to_body_frd: [0.0, 1.0, 0.0, 0.0]
    min_projected_lidar_altitude_m: 1.0
    max_projected_lidar_altitude_m: 40.0
    max_lidar_range_m: 35.0
    range_hit_epsilon_m: 0.05
    known_passages_enabled: true
    known_passages_path: worlds/known_passages.passages3d
    known_static_lidar_hit_classifier_enabled: false
    known_static_lidar_hit_closer_range_tolerance_m: 0.5
    known_static_lidar_hit_farther_range_tolerance_m: 1.5
    known_static_lidar_hit_endpoint_volume_tolerance_m: 0.75
    known_static_opening_boundary_tolerance_m: 0.50
    ambiguous_lidar_hit_required_independent_scans: 3
    ambiguous_lidar_hit_max_scan_gap_ms: 500.0
    ambiguous_lidar_hit_retention_ms: 2000.0
    ambiguous_lidar_hit_voxel_size_m: 0.5
    ambiguous_lidar_hit_min_viewpoint_shift_m: 0.5
    ambiguous_lidar_hit_min_viewpoint_angle_deg: 4.0
    ground_lidar_rejection_enabled: true
    ground_lidar_altitude_m: 0.05
    ground_lidar_closer_range_tolerance_m: 0.5
    ground_lidar_farther_range_tolerance_m: 1.5
    ground_lidar_candidate_endpoint_altitude_tolerance_m: 1.5
    ground_lidar_attached_endpoint_altitude_tolerance_m: 0.3
    lidar_uncertain_hit_confirmation_enabled: true
    lidar_uncertain_unknown_require_source_timestamp_alignment: true
    lidar_uncertain_unknown_reliable_range_margin_m: 0.5
    lidar_memory_hit_dump_enabled: true
    lidar_memory_hit_dump_path: log/lidar_memory_hits.jsonl
    lidar_memory_hit_dump_max_records: 10000
    scan_stride: 1
    hit_weight: 4
    miss_weight: 1
    min_score: -8
    max_score: 12
    occupied_score: 3
    free_score: -1

