    static_map_points_topic: /drone_city_nav/static_map_points
    static_building_markers_topic: /drone_city_nav/static_building_markers

production_mppi_node:
  ros__parameters:
    frame_id: map
    tick_rate_hz: 50.0
    rviz_rate_hz: 10.0
    diagnostics_info_rate_hz: 5.0
    diagnostics_file_rate_hz: 5.0
    diagnostics_flush_period_s: 1.0
    diagnostics_error_ring_capacity: 25
    planner_worker_count: 4
    rollouts: 8192
    open_static_rollouts: 6144
    direct_tracking_rollouts: 4096
    adaptive_rollout_minimum_clearance_m: 8.0
    adaptive_rollout_maximum_world_age_ms: 250.0
    adaptive_rollout_maximum_tracking_age_ms: 250.0
    dt_s: 0.05
    static_horizon_duration_s: 6.0
    no_static_horizon_duration_s: 4.0
    stationary_hold_validity_s: 1.0
    maximum_vertical_speed_mps: 5.0
    head_progress_horizon_s: 0.4
    head_progress_weight: 8.0
    # Prefer progress earlier in the finite horizon so receding-horizon updates
    # cannot indefinitely postpone an otherwise executable route segment.
    route_progress_integral_weight: 2.0
    planning_exposure_weight: 8.0
    # Softmax temperature and its optional adaptive floor: the effective
    # temperature is max(mppi_temperature, fraction * mean feasible cost
    # excess). With the exposure costs in the thousands a fraction above zero
    # flattens the weights into the noise mean and the update stops making
    # progress, so the adaptive floor stays off.
    mppi_temperature: 8.0
    mppi_adaptive_temperature_cost_fraction: 0.0
    # The sampler's body gate excludes rollouts inside occupied ESDF voxels from
    # the weighted update. The ESDF is coarser than the raw grid and marks
    # raw-valid passages occupied, which leaves the update hovering; the raw
    # finite-path validators keep the hard authority, so the gate stays off.
    mppi_body_collision_gate_enabled: false
    critical_exposure_weight: 2000.0
    critical_clearance_proximity_weight: 4000.0
    obstacle_approach_weight: 40.0
    obstacle_approach_response_time_s: 0.25
    obstacle_approach_deceleration_mps2: 4.0
    far_horizon_full_rate_duration_s: 2.0
    far_horizon_cost_stride: 2
    static_speed_tracking_weight: 1.0
    no_static_speed_tracking_weight: 1.0
    deadline_ms: 20.0
    maximum_pose_age_ms: 150.0
    maximum_vehicle_status_age_ms: 1000.0
    maximum_pose_prediction_age_ms: 1000.0
    maximum_esdf_age_ms: 1000.0
    static_stale_esdf_execution_window_s: 6.0
    no_static_stale_esdf_execution_window_s: 4.0
    maximum_control_feedback_age_ms: 200.0
    # A planned horizon the offboard process has not acknowledged (neither it
    # nor its immediate predecessor) may be replaced after this grace instead
    # of only after its expiry.
    execution_horizon_acknowledgement_grace_ms: 100.0
    # The observed field is an exact dense distance transform of the local
    # window; a rebuild is cheap enough to follow the raw world at this rate.
    no_static_3d_esdf_update_rate_hz: 5.0
    # Dedicated world-build threads; planner continuations keep
    # planner_worker_count to themselves.
    world_worker_count: 2
    no_static_3d_esdf_horizontal_half_extent_m: 20.0
    no_static_3d_esdf_vertical_half_extent_m: 15.0
    no_static_3d_esdf_horizontal_recenter_margin_m: 12.0
    no_static_3d_esdf_vertical_recenter_margin_m: 9.0
    raw_obstacle_snapshot_3d_topic: /drone_city_nav/raw_obstacle_snapshot_3d
    raw_obstacle_delta_3d_topic: /drone_city_nav/raw_obstacle_delta_3d
    latest_lidar_obstacle_scan_topic: /drone_city_nav/latest_lidar_obstacle_scan
    # Acquisition-aligned 3D returns are expressed in the map frame and remain
    # valid while persistent integration catches up. This budget must exceed the
    # mapper's allowed pose-alignment wait plus transport and executor jitter.
    latest_lidar_obstacle_maximum_age_ms: 1000.0
    navigation_health_topic: /drone_city_nav/mppi/navigation_health
    # Readiness remains observable, but advisory time/attempt budgets must not
    # abort a mission unless an operator explicitly enables that policy.
    navigation_health_terminal_failure_enabled: false
    maximum_unavailable_world_age_ms: 30000.0
    maximum_no_executable_route_age_ms: 30000.0
    maximum_unacknowledged_horizon_age_ms: 10000.0
    maximum_navigation_recovery_attempts: 64
    minimum_target_lookahead_m: 30.0
    maximum_target_lookahead_m: 100.0
    use_static_map: true
    static_occupancy_3d_path: worlds/generated_city.occupancy3d
    static_free_space_topology_3d_path: worlds/generated_city.topology3d
    static_esdf_3d_cache_path: worlds/generated_city.esdf3d
    cruise_speed_mps: 5.0
    absolute_speed_limit_mps: 10.0
    maximum_horizontal_acceleration_mps2: 4.0
    guaranteed_vertical_stopping_deceleration_mps2: 2.0
    maximum_control_jerk_mps3: 12.0
    speed_reaction_latency_s: 0.10
    guaranteed_lidar_detection_range_m: 30.0
    sensor_braking_physical_margin_m: 3.0
    # The goal limiter reaches zero this far before the mission goal. The
    # capture latch fires once the vehicle rests inside the capture radius, so
    # the margin only shapes where the approach comes to rest.
    goal_braking_margin_m: 0.125
    curvature_preview_distance_m: 60.0
    route_curvature_measurement_window_m: 5.0
    constrained_route_speed_limit_mps: 10.0
    constrained_route_alignment_distance_buffer_m: 5.0
    constrained_route_stationary_hold_distance_m: 2.0
    constrained_route_vertical_capture_margin_m: 0.5
    constrained_route_vertical_capture_speed_mps: 0.75
    physical_footprint_radius_m: 0.82
    physical_footprint_lower_extent_m: 0.23
    physical_footprint_upper_extent_m: 0.35
    physical_footprint_samples: 12
    physical_footprint_radial_rings: 2
    physical_footprint_axial_samples: 3
    # One raw cell per sweep step, matching the world generator's portal
    # validation capsule.
    physical_footprint_sweep_step_m: 0.25
    # Closed-loop tracking error is bounded by speed times this response horizon.
    # At 5 m/s the tube is 0.75 m; narrower passages receive a lower speed cap.
    tracking_error_tube_response_time_s: 0.15
    # Where the physical body clears raw occupancy, a constrained segment keeps
    # at least this ceiling (0.15 m tube at 1 m/s) instead of crawling.
    tracking_error_tube_minimum_progress_speed_mps: 1.0
    mppi_footprint_clearance_broad_phase_enabled: true
    route_constraint_diagnostics_distance_m: 30.0
    maximum_vertical_acceleration_mps2: 4.0
    critical_distance_m: 1.0
    preferred_distance_m: 6.0
    seed: 42
    px4_local_origin_x_m: 54.0
    px4_local_origin_y_m: 54.0
    start_x_m: 54.0
    start_y_m: 54.0
    start_z_m: 0.0
    mission_goal_sequence_xyz_m: [216.0, 378.0, 18.0]
    mission_waypoint_stop_speed_mps: 0.8
    mission_waypoint_hold_s: 2.0
    mission_waypoint_target_match_tolerance_m: 0.001
    # The lowest lattice level sits at the first half-metre above this floor;
    # with the 0.23 m lower body extent, 2.0 m keeps that level clear of
    # street-level slabs and passage floors that the lidar maps only from
    # close range, so a descent to the floor level does not end in a raw
    # collision discovered inside the vertical braking distance.
    minimum_target_z_m: 2.0
    maximum_target_z_m: 32.0
    navigation_objective_topic: /drone_city_nav/navigation_objective
    px4_vehicle_status_topic: /fmu/out/vehicle_status_v1
    mission_waypoint_acknowledgement_topic: /drone_city_nav/mission_waypoint_acknowledgement
    navigation_health_topic: /drone_city_nav/mppi/navigation_health
    dynamic_objective_replan_distance_m: 5.0
    dynamic_objective_replan_period_s: 0.25
    tracking_objective_ray_sample_spacing_m: 0.25
    static_tracking_esdf_refresh_margin_m: 15.0
    tracking_capture_radius_m: 5.0
    direct_tracking_reseed_bearing_change_rad: 0.5235987755982988
    direct_tracking_minimum_closing_speed_mps: 0.5
    direct_tracking_closing_recovery_speed_mps: 1.5
    direct_tracking_no_closing_reseed_delay_s: 1.0
    direct_tracking_minimum_reseed_interval_s: 0.5
    noncooperative_avoidance_enabled: false
    noncooperative_tracks_topic: /drone_city_nav/noncooperative_tracks
    noncooperative_prediction_horizon_s: 4.0
    noncooperative_strong_separation_m: 10.0
    noncooperative_anticipation_separation_m: 20.0
    noncooperative_release_separation_m: 15.0
    noncooperative_release_hysteresis_s: 1.0
    noncooperative_maximum_track_age_s: 0.75
    noncooperative_tracked_aircraft_radius_m: 0.82
    noncooperative_minimum_relative_speed_mps: 0.05
    noncooperative_candidate_acceleration_fraction: 0.95
    noncooperative_candidate_duration_s: 1.5
    noncooperative_strong_cost_weight: 4000.0
    noncooperative_anticipation_cost_weight: 40.0
    noncooperative_time_to_collision_gain_s: 1.0
    noncooperative_maximum_ttc_multiplier: 4.0
    px4_local_position_topic: /fmu/out/vehicle_local_position_v1
    px4_vehicle_land_detected_topic: /fmu/out/vehicle_land_detected
    obstacle_memory_status_topic: /drone_city_nav/obstacle_memory_status
    path_topic: /drone_city_nav/mppi/path
    markers_topic: /drone_city_nav/mppi/markers
    status_topic: /drone_city_nav/mppi/status
    applied_control_feedback_topic: /drone_city_nav/mppi/applied_control
    diagnostics_output_dir: log/mppi
    execution_horizon_topic: /drone_city_nav/mppi/execution_horizon
    # Liveness recovery forces the certified route candidate after a window
    # without progress. It addresses the diagnosed stationary fixed point of
    # the weighted update in front of narrow passages; the runner's
    # ENABLE_LIVENESS_RECOVERY overrides this value at launch.
    liveness_enabled: true
    liveness_observation_window_s: 1.0
    liveness_minimum_actual_displacement_m: 0.5
    liveness_minimum_predicted_terminal_progress_m: 5.0
    # Static and observed worlds feed the same persistent full-3D planner. The
    # level-zero 26-connected lattice remains complete; aligned higher levels
    # add lazy 2x/4x edges for open volume and fall back to level zero around
    # occupied geometry. Free and unknown are structurally identical; only raw
    # occupied evidence and the physical flight envelope can reject an edge.
    persistent_planner_minimum_horizontal_step_m: 2.0
    persistent_planner_minimum_vertical_step_m: 1.0
    persistent_planner_maximum_adaptive_lattice_level: 2
    persistent_planner_goal_tolerance_m: 2.0
    persistent_planner_connector_search_radius_cells: 2
    persistent_planner_feasibility_first_enabled: true
    # The feasibility frontier is dense-labelled; an expansion costs a few
    # microseconds, so a continuation can afford tens of thousands of them
    # within its share of the planner budget and reach a city-scale goal in
    # a handful of updates instead of tens of seconds.
    persistent_planner_maximum_feasibility_expansions_per_update: 32768
    persistent_planner_maximum_feasibility_compute_time_ms: 140.0
    # The feasibility-first search tries the direct raw connector to the goal
    # only from nodes within this reach.
    persistent_planner_feasibility_goal_connector_reach_m: 40.0
    persistent_planner_maximum_expansions_per_update: 200000
    persistent_planner_maximum_incremental_changed_voxels: 32768
    persistent_planner_maximum_extracted_path_nodes: 8192
    persistent_planner_maximum_shortcut_checks: 8192
    persistent_planner_maximum_compute_time_ms: 150.0
    # Soft clearance ranking of lattice edges (never a reachability rule): an
    # edge within this distance of raw occupied evidence costs its flight time
    # times 1 + weight * (1 - clearance / distance)^2. The reach equals the
    # execution risk model's preferred_distance_m: a passage opening 7 m tall
    # then ranks its middle above its floor, and a street ranks the levels 6 m
    # above the seen ground above the lowest ones. A 3 m reach left every level
    # above 3 m indifferent, so routes rode the lowest lattice levels along the
    # floor discovery frontier, where each freshly seen floor cell turned the
    # route critical for execution and the vehicle crawled.
    persistent_planner_clearance_ranking_weight: 1.5
    persistent_planner_clearance_ranking_distance_m: 6.0
    # Below the execution risk model's critical_distance_m the ranking factor
    # additionally grows by this weight times (1 - clearance / critical)^2.
    # The executor charges critical_exposure_weight per critical metre, about
    # a hundred times its progress reward per metre; the planner mirrors that
    # ratio so it detours around a critical metre the way execution would,
    # instead of handing execution a route it can only crawl along.
    persistent_planner_clearance_ranking_critical_weight: 100.0
    route_sampling_step_m: 0.5
    route_completion_tolerance_m: 2.0
    static_esdf_route_lookahead_m: 180.0
    # These switches affect optional soft costs, geometry refinement, or local
    # controller behavior. They cannot change hard occupancy semantics.
    clearance_costs_enabled: true
    static_route_geometry_optimization_enabled: true
    static_route_shortcut_optimization_enabled: false
    # The certified route candidate overrides the weighted update only while
    # its cost stays within this share of the feasible cost spread above the
    # best rollout; liveness recovery may still force it.
    stochastic_trajectory_selection_enabled: false
    route_directed_candidate_cost_tolerance: 0.5
    execution_route_cross_track_constraints_enabled: false
    execution_route_tracking_tube_constraints_enabled: false
    route_progress_replan_enabled: false
    no_eligible_route_replan_enabled: false
    # Keep a certified trajectory across freshness, authority, and publication
    # races. Raw occupancy intersecting that trajectory remains unconditional.
    execution_nonphysical_revocation_enabled: false
    # Latest-scan age is diagnostic only. Its exact owned points and persistent
    # raw occupancy remain conservative hard collision evidence.
    execution_latest_lidar_freshness_required: false
    static_route_maximum_shortcut_length_m: 30.0
    static_route_sparse_deviation_tolerance_m: 0.05
    static_route_maximum_shortcut_turn_increase_rad: 0.35
    static_route_shortcut_validation_batch_size: 4
