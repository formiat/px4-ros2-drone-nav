obstacle_memory_node:
  ros__parameters:
    persistent_memory_enabled: true
    frame_id: map
    lidar_topic: /scan
    px4_local_position_topic: /fmu/out/vehicle_local_position_v1
    px4_vehicle_attitude_topic: /fmu/out/vehicle_attitude
    px4_timesync_status_topic: /fmu/out/timesync_status
    obstacle_memory_grid_topic: /drone_city_nav/obstacle_memory_grid
    raw_memory_3d_pointcloud_topic: /drone_city_nav/raw_memory_obstacle_points_3d
    obstacle_memory_provenance_topic: /drone_city_nav/obstacle_memory_provenance
    obstacle_memory_snapshot_topic: /drone_city_nav/obstacle_memory_snapshot
    obstacle_memory_status_topic: /drone_city_nav/obstacle_memory_status
    raw_obstacle_snapshot_topic: /drone_city_nav/raw_obstacle_snapshot
    raw_obstacle_delta_topic: /drone_city_nav/raw_obstacle_delta
    latest_lidar_obstacle_scan_topic: /drone_city_nav/latest_lidar_obstacle_scan
    raw_obstacle_delta_chunk_size_cells: 32
    use_static_map: true
    risk_critical_distance_m: 1.0
    risk_preferred_distance_m: 6.0
    obstacle_memory_debug_publish_period_s: 1.0
    obstacle_memory_snapshot_diagnostic_period_s: 5.0
    obstacle_memory_snapshot_max_serialized_bytes: 4500000
    obstacle_memory_snapshot_max_assembly_time_ms: 100.0
    obstacle_memory_snapshot_max_publish_interval_ms: 1500.0
    grid_resolution_m: 0.5
    grid_width_m: 345.0
    grid_height_m: 525.0
    grid_origin_x: -30.0
    grid_origin_y: -30.0
    initial_x_m: 54.0
    initial_y_m: 54.0
    # Used as the map yaw only when PX4 heading projection is disabled. With PX4
    # enabled it is only the startup alignment reference.
    initial_heading_rad: 1.5707963267948966
    px4_local_origin_x_m: 54.0
    px4_local_origin_y_m: 54.0
    use_initial_pose_until_px4: true
    max_pose_staleness_s: 1.0
    min_mapping_altitude_m: 5.0
    scan_yaw_offset_rad: 0.0
    use_px4_heading_for_scan: true
    maximum_heading_variance_rad2: 0.05
    startup_heading_stable_sample_count: 5
    startup_heading_maximum_sample_delta_rad: 0.05
    motion_compensate_lidar_pose: true
    lidar_pose_latency_s: 0.05
    lidar_scan_alignment_maximum_wait_s: 0.35
    lidar_scan_alignment_queue_capacity: 8
    lidar_pose_source_maximum_receive_delay_s: 1.0
    lidar_pose_source_maximum_future_skew_s: 0.1
    compensate_lidar_attitude: true
    lidar_mount_roll_rad: 0.0
    lidar_mount_pitch_rad: 0.0
    lidar_mount_yaw_rad: 0.0
    lidar_z_offset_m: 0.315
    use_full_lidar_extrinsic: true
    lidar_extrinsic_translation_body_frd_m: [0.12, 0.0, -0.315]
    lidar_extrinsic_quaternion_lidar_flu_to_body_frd: [0.0, 1.0, 0.0, 0.0]
    lidar_self_filter_radius_m: 0.9
    lidar_self_filter_upward_extent_m: 0.5
    lidar_self_filter_downward_extent_m: 0.5
    min_projected_lidar_altitude_m: 1.0
    max_projected_lidar_altitude_m: 40.0
    max_lidar_range_m: 35.0
    range_hit_epsilon_m: 0.05
    ambiguous_lidar_hit_required_independent_scans: 3
    ambiguous_lidar_hit_max_scan_gap_ms: 500.0
    ambiguous_lidar_hit_retention_ms: 2000.0
    ambiguous_lidar_hit_voxel_size_m: 0.5
    ambiguous_lidar_hit_min_viewpoint_shift_m: 0.5
    ambiguous_lidar_hit_min_viewpoint_angle_deg: 4.0
    ground_lidar_rejection_enabled: true
    ground_lidar_altitude_m: 0.05
    ground_lidar_closer_range_tolerance_m: 0.5
    ground_lidar_farther_range_tolerance_m: 1.5
    ground_lidar_candidate_endpoint_altitude_tolerance_m: 1.5
    ground_lidar_attached_endpoint_altitude_tolerance_m: 0.3
    lidar_uncertain_hit_confirmation_enabled: true
    lidar_uncertain_unknown_require_source_timestamp_alignment: true
    lidar_uncertain_unknown_reliable_range_margin_m: 0.5
    lidar_memory_hit_dump_enabled: true
    lidar_memory_hit_dump_path: log/lidar_memory_hits.jsonl
    lidar_memory_hit_dump_max_records: 10000
    scan_stride: 1
    hit_weight: 4
    miss_weight: 1
    min_score: -8
    max_score: 12
    occupied_score: 3
    free_score: -1

obstacle_memory_3d_node:
  ros__parameters:
    persistent_memory_enabled: true
    # Latest-wins integration: when integration cannot keep up with the scan
    # rate, the newest scan is integrated and older ones are dropped, so the
    # committed raw world stays within the execution freshness budget.
    lidar_memory_scan_queue_capacity: 1
    frame_id: map
    lidar_3d_topic: /lidar_3d/points
    px4_local_position_topic: /fmu/out/vehicle_local_position_v1
    px4_vehicle_attitude_topic: /fmu/out/vehicle_attitude
    px4_timesync_status_topic: /fmu/out/timesync_status
    px4_vehicle_status_topic: /fmu/out/vehicle_status_v1
    latest_lidar_obstacle_scan_topic: /drone_city_nav/latest_lidar_obstacle_scan
    current_lidar_3d_pointcloud_topic: /drone_city_nav/current_lidar_returns_3d
    raw_memory_3d_pointcloud_topic: /drone_city_nav/raw_memory_obstacle_points_3d
    raw_obstacle_snapshot_3d_topic: /drone_city_nav/raw_obstacle_snapshot_3d
    raw_obstacle_delta_3d_topic: /drone_city_nav/raw_obstacle_delta_3d
    obstacle_memory_status_topic: /drone_city_nav/obstacle_memory_status
    use_static_map: true
    grid_resolution_m: 0.25
    grid_width_m: 345.0
    grid_height_m: 525.0
    grid_depth_m: 40.0
    grid_origin_x: -30.0
    grid_origin_y: -30.0
    grid_origin_z: 0.0
    initial_x_m: 54.0
    initial_y_m: 54.0
    initial_heading_rad: 1.5707963267948966
    px4_local_origin_x_m: 54.0
    px4_local_origin_y_m: 54.0
    px4_local_origin_z_m: 0.0
    use_initial_pose_until_px4: true
    max_pose_staleness_s: 1.0
    min_mapping_altitude_m: 1.0
    # Adjacent returns of the organized scan whose range step fits one surface
    # viewed within the incidence limit are joined by occupied surface samples.
    # The sparse beam layout otherwise maps a wall as rows and columns spaced
    # by range times beam spacing, and the band between them stays unknown
    # until the sensor is within a few metres. Vertical neighbours keep a tight
    # limit (a ceiling or floor in front of a wall would otherwise be joined
    # into a ramp through free volume); horizontal neighbours keep a wide one
    # (a row meets a wall at grazing incidence exactly where its columns are
    # sparse, and a depth edge steps far beyond any incidence).
    lidar_surface_interpolation_enabled: true
    lidar_surface_interpolation_maximum_incidence_deg: 30.0
    lidar_surface_interpolation_maximum_row_incidence_deg: 80.0
    use_px4_heading_for_scan: true
    maximum_heading_variance_rad2: 0.05
    startup_heading_stable_sample_count: 5
    startup_heading_maximum_sample_delta_rad: 0.05
    motion_compensate_lidar_pose: true
    lidar_pose_latency_s: 0.05
    lidar_scan_alignment_maximum_wait_s: 0.35
    lidar_scan_alignment_queue_capacity: 8
    lidar_pose_source_maximum_receive_delay_s: 1.0
    lidar_pose_source_maximum_future_skew_s: 0.1
    compensate_lidar_attitude: true
    lidar_mount_roll_rad: 0.0
    lidar_mount_pitch_rad: 0.0
    lidar_mount_yaw_rad: 0.0
    lidar_z_offset_m: 0.0
    use_full_lidar_extrinsic: true
    lidar_extrinsic_translation_body_frd_m: [0.12, 0.0, -0.315]
    lidar_extrinsic_quaternion_lidar_flu_to_body_frd: [0.0, 1.0, 0.0, 0.0]
    lidar_3d_horizontal_samples: 240
    lidar_3d_vertical_samples: 19
    lidar_3d_horizontal_min_angle_rad: -3.141592653589793
    lidar_3d_horizontal_max_angle_rad: 3.141592653589793
    lidar_3d_vertical_min_angle_rad: -1.5707963267948966
    lidar_3d_vertical_max_angle_rad: 1.5707963267948966
    lidar_3d_minimum_range_m: 0.2
    max_lidar_range_m: 35.0
    range_hit_epsilon_m: 0.05
    scan_stride: 1
    hit_weight: 4
    miss_weight: 1
    min_score: -8
    max_score: 12
    occupied_score: 3
    free_score: -1
    obstacle_memory_3d_transport_rate_hz: 2.0
    obstacle_memory_3d_snapshot_minimum_period_s: 10.0
    obstacle_memory_3d_snapshot_maximum_period_s: 30.0
    obstacle_memory_3d_snapshot_rebase_dirty_ratio: 0.75
    obstacle_memory_3d_debug_period_s: 1.0
    obstacle_memory_3d_debug_stride: 2

world_visualization_node:
  ros__parameters:
    frame_id: map
    use_static_map: true
    static_occupancy_3d_path: worlds/generated_city.occupancy3d
    static_map_visualization_stride_cells: 4
    raw_obstacle_snapshot_topic: /drone_city_nav/raw_obstacle_snapshot
    raw_obstacle_grid_topic: /drone_city_nav/raw_obstacle_grid
