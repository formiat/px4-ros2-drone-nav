# The stack bag recorder's subscriptions (roadmap item 27 block 6, scripts/stack_bag_topics.py): best effort and
# volatile where a topic has publishers of both reliabilities, so that every publisher reaches the recorder (the
# mission events: the monitor's reliable, the survey node's best effort; r2874 recorded one publisher's alone). A
# best-effort subscription is compatible with a reliable publisher and with a best-effort one. The replay's player
# offers each topic the QoS the bag recorded.
/drone_city_nav/mission_events:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 100
# The streams the estimators consume sample by sample, a second of the fastest and more in the recorder's
# history: the recorder asks for the publisher's depth, Fast DDS does not announce one, and the default of ten
# holds 40 ms of the 250 Hz IMU. A recorder kept off its core that long lost a sample the stack had (r2938 to
# r2940: one to three of the autopilot's samples a flight missing from the bag and present in the relayed copy;
# r2939: one of the rest second's, and the replayed pose was declared 3e-8 rad from the flown one).
/fmu/out/sensor_combined:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/fmu/out/sensor_combined/relayed:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/fmu/out/vehicle_attitude:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/barometer/air_pressure:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/magnetometer/magnetic_field:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
